coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto

flags:
  python:
    paths:
      - crates/hessian2-python/python/
    carryforward: true
  rust:
    paths:
      - crates/hessian2-core/src/
    carryforward: true

comment: false
