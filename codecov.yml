coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        # A fixed bar: "auto" demands the project's own near-100% rate of
        # every change, which an unreachable defensive line fails.
        target: 95%

flags:
  python:
    paths:
      - crates/hessian2-python/python/
    carryforward: true
  rust:
    paths:
      - crates/hessian2-core/src/
    carryforward: true

comment: false
