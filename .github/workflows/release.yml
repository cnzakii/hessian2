name: Release

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release_*.py"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "CHANGELOG.md"
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      maturin: ${{ steps.maturin.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check version and release tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [ -n "$RELEASE_TAG" ]; then
            test "$RELEASE_TAG" = "v$version"
            grep -Fq "## [$version] - " CHANGELOG.md
            git merge-base --is-ancestor HEAD origin/main
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The scripts and the maturin version need no build of the extension.
      - run: uv sync --locked --no-install-workspace --group release
      - name: Read locked maturin version
        id: maturin
        shell: bash
        run: |
          version="$(uv run --no-sync maturin --version)"
          echo "version=v${version#maturin }" >> "$GITHUB_OUTPUT"
      - run: uv run --no-sync pytest -q scripts/test_release_check.py

  wheels:
    name: Wheel (${{ matrix.platform }}, ${{ matrix.python }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: [manylinux-x86_64, manylinux-aarch64, musllinux-x86_64, musllinux-aarch64, macos-x86_64, macos-aarch64, windows-x86_64, windows-aarch64]
        python: ["3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
        include:
          - platform: manylinux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux2014_x86_64
            manylinux: "2014"
          - platform: manylinux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux2014_aarch64
            manylinux: "2014"
          - platform: musllinux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            container: quay.io/pypa/musllinux_1_2_x86_64
            manylinux: musllinux_1_2
          - platform: musllinux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            container: quay.io/pypa/musllinux_1_2_aarch64
            manylinux: musllinux_1_2
          - platform: macos-x86_64
            os: macos-26-intel
            target: x86_64-apple-darwin
          - platform: macos-aarch64
            os: macos-26
            target: aarch64-apple-darwin
          - platform: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: runner.os != 'Linux'
        with:
          python-version: ${{ matrix.python }}
      - name: Select interpreter
        id: python
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          tag="cp${PYTHON_VERSION//./}"
          tag="${tag%t}"
          abi="$tag"
          case "$PYTHON_VERSION" in *t) abi="${tag}t" ;; esac
          if [ '${{ runner.os }}' = Linux ]; then
            python="/opt/python/$tag-$abi/bin/python"
          else
            uv python install "$PYTHON_VERSION"
            python="$(uv python find --system --managed-python "$PYTHON_VERSION")"
            test -n "$python"
          fi
          echo "path=$python" >> "$GITHUB_OUTPUT"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ needs.validate.outputs.maturin }}
          rust-toolchain: stable
          target: ${{ matrix.target }}
          container: ${{ matrix.container }}
          manylinux: ${{ matrix.manylinux }}
          args: >-
            --release --locked --compatibility pypi
            --manifest-path crates/hessian2-python/Cargo.toml
            --interpreter "${{ steps.python.outputs.path }}"
            --out target/dist
      - name: Test Linux wheel in its matching libc container
        if: runner.os == 'Linux'
        shell: bash
        env:
          IMAGE: ${{ matrix.container }}
          PYTHON: ${{ steps.python.outputs.path }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          docker run --rm --volume "$PWD:/io:ro" --workdir /tmp \
            --env PYTHONDONTWRITEBYTECODE=1 --env HYPOTHESIS_STORAGE_DIRECTORY=/tmp/hypothesis \
            "$IMAGE" sh -ec '
              "$1" -m venv /tmp/wheel-test
              python=/tmp/wheel-test/bin/python
              "$python" -m pip install uv==0.12.0
              "$python" -m uv export --project /io --locked --only-group test --no-emit-workspace --output-file /tmp/requirements.txt
              "$python" -m pip install --require-hashes -r /tmp/requirements.txt
              "$python" -m pip install --no-deps /io/target/dist/*.whl
              "$python" -I /io/scripts/release_smoke.py "$2"
              "$python" -m pytest -q -p no:cacheprovider /io/crates/hessian2-python/tests
            ' sh "$PYTHON" "$VERSION"
      - name: Test macOS or Windows wheel in a clean environment
        if: runner.os != 'Linux'
        shell: bash
        env:
          PYTHON: ${{ steps.python.outputs.path }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          uv venv --python "$PYTHON" target/wheel-test
          if [ '${{ runner.os }}' = Windows ]; then
            python=target/wheel-test/Scripts/python.exe
          else
            python=target/wheel-test/bin/python
          fi
          uv export --locked --only-group test --no-emit-workspace --output-file target/wheel-test-requirements.txt
          uv pip install --python "$python" --require-hashes -r target/wheel-test-requirements.txt
          uv pip install --python "$python" --no-deps target/dist/*.whl
          "$python" -I scripts/release_smoke.py "$VERSION"
          "$python" -m pytest -q -p no:cacheprovider crates/hessian2-python/tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-${{ matrix.platform }}-${{ matrix.python }}
          path: target/dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
      - run: uv sync --locked --no-install-workspace
      - name: Build and install source archive
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          uv run --no-sync maturin sdist --manifest-path crates/hessian2-python/Cargo.toml --out target/dist
          uv venv target/sdist-test
          uv pip install --python target/sdist-test/bin/python target/dist/*.tar.gz
          target/sdist-test/bin/python -I scripts/release_smoke.py "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-sdist
          path: target/dist/*.tar.gz
          if-no-files-found: error

  crate:
    name: Rust crate archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: "1.88.0"
      - run: cargo package -p hessian2-core --locked

  collect:
    name: Check release artifacts
    needs: [validate, wheels, sdist, crate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Keep artifacts out of target/, where Cargo writes its own files.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - name: Verify complete wheel set and package metadata
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          uv run --locked --only-group release python scripts/release_check.py dist "$VERSION"
          uv run --locked --only-group release twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-python-distributions
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: collect
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: validated-python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/

  publish-crate:
    name: Publish to crates.io
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: collect
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: auth
      - run: cargo publish -p hessian2-core --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, publish-pypi, publish-crate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create release notes from the changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # Release notes render single line breaks, so join wrapped lines.
          awk -v heading="## [$VERSION] - " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found && /^  [^ *-]/ { sub(/^ +/, ""); line = line " " $0; next }
            found { if (started) print line; line = $0; started = 1 }
            END { if (started) print line }
          ' CHANGELOG.md > release-notes.md
          grep -q '[^[:space:]]' release-notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
